<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>

    <!-- Jellyfin Primary Gradient -->
    <linearGradient id="jfGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#b855d4"/>
      <stop offset="50%" stop-color="#7359d9"/>
      <stop offset="100%" stop-color="#00a4dc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Accent Gradient for Control Badge -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066fe"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#3a3d54" stroke-width="6"/>

  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#jfGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Jellyfin Icon Shape (Centered and slightly shifted up) -->
  <g transform="translate(76, 50) scale(0.70)" filter="url(#glow)">
    <path d="M256,201.6c-20.4,0-86.2,119.3-76.2,139.4s142.5,19.9,152.4,0S276.5,201.6,256,201.6z" fill="url(#jfGrad)"/>
    <path d="M256,23.3c-61.6,0-259.8,359.4-229.6,420.1s429.3,60,459.2,0S317.6,23.3,256,23.3z
             M406.5,390.8c-19.6,39.3-281.1,39.8-300.9,0s110.1-275.3,150.4-275.3S426.1,351.4,406.5,390.8z" fill="url(#jfGrad)"/>
  </g>

  <!-- Control / Dashboard Badge Base -->
  <circle cx="390" cy="390" r="76" fill="#141724" stroke="#00a4dc" stroke-width="6" filter="url(#glow)"/>

  <!-- Sliders / Controls Graphic inside Badge -->
  <!-- Track 1 -->
  <line x1="356" y1="352" x2="356" y2="428" stroke="#3b4261" stroke-width="6" stroke-linecap="round"/>
  <circle cx="356" cy="376" r="10" fill="#00d2ff"/>

  <!-- Track 2 (Active Center) -->
  <line x1="390" y1="352" x2="390" y2="428" stroke="#3b4261" stroke-width="6" stroke-linecap="round"/>
  <circle cx="390" cy="406" r="10" fill="#b855d4"/>

  <!-- Track 3 -->
  <line x1="424" y1="352" x2="424" y2="428" stroke="#3b4261" stroke-width="6" stroke-linecap="round"/>
  <circle cx="424" cy="370" r="10" fill="#00d2ff"/>
</svg>
